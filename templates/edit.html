<!doctype html><html lang=fa dir=rtl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>مدیریت کاربر</title>
<style>body{margin:0;background:#070b12;color:#eef;font-family:Tahoma,Arial}.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#101722;border:1px solid #243047;border-radius:18px;padding:18px;margin-bottom:18px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #33415c;background:#0a1019;color:#fff;margin:5px 0}textarea{min-height:140px;direction:ltr;text-align:left}button{cursor:pointer}.primary{background:#18d3a5;color:#06120f;border:0;font-weight:bold}.danger{background:#d9536f;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.config{border-top:1px solid #273247;padding:12px 0}.url{direction:ltr;word-break:break-all;background:#0a1019;padding:10px;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<div class=wrap><a href=/admin>← بازگشت</a><h1>{{u.name}}</h1>
<div class=card><h2>اطلاعات کاربر</h2><form method=post action="/admin/users/{{u.id}}/save"><input name=name value="{{u.name}}" required><input name=traffic_gb type=number step=.1 min=0 value="{{u.traffic_limit/1024/1024/1024}}" placeholder="حجم GB"><input name=traffic_used_gb type=number step=.1 min=0 value="{{u.traffic_used/1024/1024/1024}}" placeholder="مصرف GB"><input name=expires_at type=datetime-local value="{{u.expires_at.strftime('%Y-%m-%dT%H:%M') if u.expires_at else ''}}"><label><input style="width:auto" name=active type=checkbox {% if u.active %}checked{% endif %}> فعال</label><button class=primary>ذخیره</button></form><p>ساب‌لینک:</p><div class=url>{{base_url}}/sub/{{u.token}}</div><p><img src="/qr/{{u.token}}.png" width=180></p></div>
<div class=grid><div class=card><h2>افزودن کانفیگ</h2><form method=post action="/admin/users/{{u.id}}/configs"><input name=name placeholder="نام کانفیگ" required><textarea name=content placeholder="vless://... یا vmess://... یا sing-box/json ..."></textarea><button class=primary>افزودن</button></form></div>
<div class=card><h2>کانفیگ‌ها</h2>{% for c in u.configs %}<div class=config><b>{{c.name}}</b><pre style="white-space:pre-wrap;direction:ltr">{{c.content}}</pre><form method=post action="/admin/configs/{{c.id}}/delete"><button class=danger>حذف</button></form></div>{% else %}<p>کانفیگی وجود ندارد.</p>{% endfor %}</div></div></div></html>
